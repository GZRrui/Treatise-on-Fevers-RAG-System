[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider --disable-socket --allow-hosts=127.0.0.1,::1 --allow-unix-socket"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
files = [
    "backend/app/config.py",
    "scripts/capture_phase0_baseline.py",
    "scripts/data_quality.py",
    "scripts/snapshot_probe.py",
    "scripts/supply_chain.py",
]
strict = true
follow_imports = "skip"
show_error_codes = true
pretty = true

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["storage", ".test-temp"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"scripts/data_quality.py" = ["E501", "RUF001"]
"scripts/supply_chain.py" = ["RUF001"]

[[tool.mypy.overrides]]
module = "backend.app.config"
disallow_subclassing_any = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = [
    "jsonschema",
    "llama_index.embeddings.dashscope",
    "llama_index.llms.dashscope",
]
ignore_missing_imports = true

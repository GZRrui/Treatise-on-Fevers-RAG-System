name: phase-0-quality

on:
  pull_request:
  push:
    branches: [main, "codex/phase-0"]

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONHASHSEED: "20260805"

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The phase-0 snapshot verifier archives ORIGINAL_REF, not only HEAD.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Verify Python runtime
        run: python -c "import platform; assert platform.python_version() == '3.11.15'"
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q backend config.py evaluation scripts src tests
      - name: Run offline tests
        run: python -m pytest -q
      - name: Run strict type checks
        run: python -m mypy
      - name: Run phase-0 lint checks
        run: >-
          python -m ruff check
          backend/app/config.py
          scripts/capture_phase0_baseline.py
          scripts/data_quality.py
          scripts/snapshot_probe.py
          scripts/supply_chain.py
          tests/conftest.py
          tests/test_settings_contract.py
      - name: Verify data integrity baseline
        run: python scripts/data_quality.py
      - name: Verify original baseline commit is available
        run: git cat-file -e 37d2c122cee1956c83d99f64996b4f15976053d4^{commit}
      - name: Verify original-system snapshot
        run: python scripts/capture_phase0_baseline.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify npm runtime
        run: test "$(npm --version)" = "10.9.2"
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - id: audit
        continue-on-error: true
        run: python scripts/supply_chain.py --fail-on-vulnerability
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-0-supply-chain
          path: docs/baselines/supply-chain
      - if: steps.audit.outcome != 'success'
        run: exit 1
